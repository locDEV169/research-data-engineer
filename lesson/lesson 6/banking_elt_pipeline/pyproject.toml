[project]
name = "banking-elt-pipeline"
version = "0.1.0"
description = "ELT pipeline: PostgreSQL (core banking) -> BigQuery raw -> BigQuery clean"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery==3.25.0",
    "pandas==2.2.2",
    "psycopg[binary]==3.2.1",
    "pyarrow==16.1.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
